<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radwa Vending – Refill history</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
<style>
.rowb{margin-bottom:14px}
.rowh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rowh .rn{background:#173404;color:#84BD00;font-weight:800;font-size:12px;border-radius:8px;padding:4px 9px;white-space:nowrap}
.rowh .mn{font-size:14px;font-weight:700;color:#1c1917;flex:1;min-width:140px}
.rowh .mn small{display:block;font-size:11px;font-weight:500;color:#78716c}
.rowh .rt{font-size:12px;color:#57534e;font-weight:600;white-space:nowrap}
.rowh .f{font-family:inherit;font-size:12px;font-weight:700;border:1px solid #84BD00;background:#fff;color:#4d7000;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.sg{display:grid;gap:6px}
.sl{border:1.5px solid #e7e5e4;border-radius:12px;padding:8px 6px;background:#fafaf9;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sl.chg{border-color:#84BD00;background:#f1f9dc}
.sl .lb{font-size:11px;font-weight:700;color:#57534e}
.sl .qq{font-size:20px;font-weight:800;color:#1c1917;line-height:1;font-variant-numeric:tabular-nums}
.sl .qq i{font-style:normal;font-size:12px;font-weight:600;color:#78716c}
.sl .dd{font-size:11px;font-weight:700;height:14px;color:#4d7000}
.sl .dd.n{color:#be123c}
.sl .bt{display:flex;gap:4px;width:100%}
.sl .bt button{flex:1;height:42px;min-width:0;border:1px solid #d6d3d1;background:#fff;border-radius:9px;font-size:20px;font-weight:700;color:#173404;cursor:pointer;touch-action:manipulation}
.sl .bt button:active{background:#e8f3cc}
.bar2{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 2px;margin-top:6px;background:#fff;border-top:1px solid #f1f5f9}
.bar2 .sm{font-size:13px;font-weight:700;flex:1;min-width:120px}
.bar2 .btn{height:44px}
.note{font-size:12px;padding:8px 12px;border-radius:8px;margin-top:8px}
.note.ok{background:#ecfdf5;color:#047857}.note.bad{background:#fff1f2;color:#be123c}
@media(max-width:640px){
  .card{padding:14px}
  .bar2 .btn{flex:1}
  .bar2 .sm{flex-basis:100%}
}
</style>
</head>
<body>
<div id="hdr"></div>
<div class="wrap" id="fill" style="padding-bottom:0"></div>
<div class="wrap" id="out"><div class="msg">Loading…</div></div>
<script src="/ui.js"></script>
<script>
(function(){
  var U = RUI, esc = U.esc;
  var actions = U.header('refill', { sub: 'Refill history · Dahban · Machine 203617400' });
  var rpHost = document.createElement('div');
  var xl = document.createElement('button'); xl.className = 'btn green'; xl.textContent = '⬇ Excel';
  actions.appendChild(rpHost); actions.appendChild(xl);

  var t = U.todayISO(), from = t.slice(0,8)+'01', to = t, showAll = false, last = null;
  var qs = function(){ return 'from='+from+'&to='+to; };
  U.rangePicker(rpHost, { from: from, to: to, onChange: function(f, e){ from = f; to = e; load(); } });
  xl.onclick = function(){ window.location = '/api/refills.xlsx?'+qs(); };

  function stat(l, v, s, cls){ return '<div class="stat '+(cls||'')+'"><div class="l">'+esc(l)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>'; }
  function sec(n, title, badge, body){
    return '<div class="card"><div class="sec-h"><div class="sec-n">'+n+'</div><span class="sec-t">'+title+'</span>'+(badge?'<span class="badge">'+esc(badge)+'</span>':'')+'</div>'+body+'</div>';
  }
  function items(s){
    return s.items.map(function(i){ return esc(i.sku)+' <b class="pos">+'+i.added+'</b>'+(i.removed?' <b class="neg">−'+i.removed+'</b>':''); }).join(' · ');
  }
  function render(d){
    last = d; var k = d.kpis, h = '';
    h += '<div class="stats">'+
      stat('Refill sessions', k.sessions, d.from+' → '+d.to, 'info')+
      stat('Units added', '+'+k.added, 'put into the machine', 'good')+
      stat('Units removed', k.removed ? '−'+k.removed : '0', 'taken out / corrections', k.removed ? 'warn' : '')+
      stat('Last refill', k.last || '—', k.people+' '+(k.people===1?'person':'people')+' in range')+
      '</div>';

    var sb;
    if (!d.sessions.length) sb = '<div class="msg">No refills in this range.</div>';
    else {
      var list = showAll ? d.sessions : d.sessions.slice(0,100);
      sb = '<div class="scroll"><table><tr><th>Start (KSA)</th><th>End</th><th>Refilled by</th><th>Products</th><th class="n">Added</th><th class="n">Removed</th></tr>';
      list.forEach(function(s){
        sb += '<tr><td>'+esc(s.start)+'</td><td>'+esc(s.end.slice(11))+'</td><td>'+esc(s.who)+'</td><td>'+items(s)+'</td><td class="n pos">+'+s.added+'</td><td class="n'+(s.removed?' neg':'')+'">'+(s.removed?'−'+s.removed:'0')+'</td></tr>';
      });
      sb += '</table></div>';
      if (d.sessions.length > 100 && !showAll) sb += '<div class="more"><button class="btn" id="all">Show all '+d.sessions.length+'</button></div>';
    }
    h += sec(1, 'Refill sessions', String(d.sessions.length), sb);

    var pb = '<div class="scroll"><table><tr><th>Product</th><th class="n">Added</th><th class="n">Removed</th></tr>';
    d.bySku.forEach(function(x){ pb += '<tr><td><b>'+esc(x.sku)+'</b> · '+esc(x.product)+'</td><td class="n pos">+'+x.added+'</td><td class="n'+(x.removed?' neg':'')+'">'+(x.removed?'−'+x.removed:'0')+'</td></tr>'; });
    if (!d.bySku.length) pb += '<tr><td colspan="3" class="msg">No data</td></tr>';
    h += sec(2, 'By product', '', pb+'</table></div>');

    var wb = '<div class="scroll"><table><tr><th>Person</th><th class="n">Sessions</th><th class="n">Added</th><th class="n">Removed</th></tr>';
    d.byWho.forEach(function(x){ wb += '<tr><td>'+esc(x.who)+'</td><td class="n">'+x.sessions+'</td><td class="n pos">+'+x.added+'</td><td class="n'+(x.removed?' neg':'')+'">'+(x.removed?'−'+x.removed:'0')+'</td></tr>'; });
    if (!d.byWho.length) wb += '<tr><td colspan="4" class="msg">No data</td></tr>';
    h += sec(3, 'By person', '', wb+'</table></div>');

    h += '<div class="msg" style="padding:4px">Sessions group one person\'s slot refills made within 30 minutes of each other. '+d.loaded+' records loaded'+(d.total?' of '+d.total:'')+'.</div>';
    document.getElementById('out').innerHTML = h;
    var a = document.getElementById('all'); if (a) a.onclick = function(){ showAll = true; render(last); };
  }
  function load(){
    showAll = false;
    document.getElementById('out').innerHTML = '<div class="msg">Loading… (first load can take ~15 s)</div>';
    U.getJSON('/api/refills?'+qs()).then(function(d){
      if (d.error) throw new Error(d.error);
      render(d);
    }).catch(function(e){ document.getElementById('out').innerHTML = '<div class="msg err">Could not load refills: '+esc(e.message)+'</div>'; });
  }
  window.reloadHistory = load;
  load();
})();

(function(){
  var U = RUI, esc = U.esc, box = document.getElementById('fill');
  var slots = [], draft = {}, busy = false, msg = '';
  function tok(){ return 'r' + Date.now() + Math.random().toString(36).slice(2); }
  function get(id){ return slots.filter(function(s){return s.id===id;})[0]; }
  function clamp(s, v){ return Math.max(-s.amount, Math.min(s.free, v)); }
  function total(){ var n=0,u=0; Object.keys(draft).forEach(function(k){ if(draft[k]){n++;u+=draft[k];} }); return [n,u]; }
  function draw(){
    var rows = {}; slots.forEach(function(s){ (rows[s.row] = rows[s.row] || []).push(s); });
    var cap=0, cur=0; slots.forEach(function(s){ cap+=s.vol; cur+=s.amount; });
    var h = '<div class="card"><div class="sec-h"><div class="sec-n">+</div><span class="sec-t">Refill machine</span><span class="badge">'+cur+' / '+cap+' units in machine</span></div>';
    if (!slots.length) h += '<div class="msg">Loading slots…</div>';
    Object.keys(rows).forEach(function(r){
      var list = rows[r], f = list[0], rc=0, rv=0, rf=0;
      list.forEach(function(s){ rc+=s.vol; rv+=s.amount; rf+=s.free; });
      h += '<div class="rowb"><div class="rowh"><span class="rn">Row '+esc(r)+'</span><div class="mn">'+esc(f.name)+'<small>'+esc(f.sku)+' · Frozen Ready Meal</small></div><span class="rt">'+rv+' / '+rc+'</span>'+
        '<button class="f" data-a="row" data-r="'+esc(r)+'"'+(rf?'':' disabled')+'>Fill row (+'+rf+')</button></div>'+
        '<div class="sg" style="grid-template-columns:repeat('+Math.min(list.length,6)+',minmax(0,1fr))">' + list.map(function(s){
          var d = draft[s.id] || 0;
          return '<div class="sl'+(d?' chg':'')+'"><div class="lb">'+esc(s.label)+'</div><div class="qq">'+(s.amount+d)+'<i>/'+s.vol+'</i></div>'+
            '<div class="dd'+(d<0?' n':'')+'">'+(d?(d>0?'+':'')+d:'')+'</div>'+
            '<div class="bt"><button data-a="m" data-id="'+s.id+'" aria-label="minus">−</button><button data-a="p" data-id="'+s.id+'" aria-label="plus">+</button></div></div>';
        }).join('') + '</div></div>';
    });
    var t = total();
    h += '<div class="bar2"><span class="sm">'+(t[0]?t[0]+' slot'+(t[0]>1?'s':'')+' · '+(t[1]>0?'+':'')+t[1]+' units':'Tap + on a slot to add stock')+'</span>'+
      '<button class="btn" data-a="all">Fill all</button><button class="btn" data-a="clr"'+(t[0]?'':' disabled')+'>Clear</button>'+
      '<button class="btn green" data-a="go"'+(t[0]&&!busy?'':' disabled')+'>'+(busy?'Sending…':'Apply refill')+'</button></div>';
    if (msg) h += msg;
    box.innerHTML = h + '</div>';
  }
  box.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b || !b.dataset.a || b.disabled) return;
    var a = b.dataset.a, s = b.dataset.id && get(b.dataset.id);
    if (a==='m') draft[s.id] = clamp(s, (draft[s.id]||0)-1);
    else if (a==='p') draft[s.id] = clamp(s, (draft[s.id]||0)+1);
    else if (a==='row') slots.forEach(function(x){ if (String(x.row)===b.dataset.r) draft[x.id] = x.free; });
    else if (a==='all') slots.forEach(function(x){ draft[x.id] = x.free; });
    else if (a==='clr') { draft = {}; msg = ''; }
    else if (a==='go') return apply();
    msg = ''; draw();
  });
  function apply(){
    var list = slots.filter(function(s){ return draft[s.id]; });
    if (!list.length || busy) return;
    var txt = list.map(function(s){ return s.label+': '+s.amount+' → '+(s.amount+draft[s.id])+' ('+(draft[s.id]>0?'+':'')+draft[s.id]+')'; }).join('\n');
    if (!confirm('Send this to the vending cloud?\n\n'+txt)) return;
    busy = true; msg = ''; draw();
    fetch('/api/replenish', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: tok(), changes: list.map(function(s){ return { id: s.id, delta: draft[s.id] }; }) }) })
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.error) { msg = '<div class="note bad">'+esc(d.error)+'</div>'; }
      else {
        var okn = d.results.filter(function(x){return x.ok;}).length;
        msg = '<div class="note '+(d.ok?'ok':'bad')+'">'+(d.ok ? 'Done: '+okn+' slot'+(okn>1?'s':'')+' updated.' : okn+' updated, then stopped: '+esc((d.results.filter(function(x){return !x.ok;})[0]||{}).msg||'error')+'. '+d.skipped+' not sent.')+'</div>';
        draft = {};
      }
    }).catch(function(e){ msg = '<div class="note bad">'+esc(e.message)+'</div>'; })
    .then(function(){ busy = false; load(); if (window.reloadHistory) setTimeout(window.reloadHistory, 1500); });
  }
  function load(){
    U.getJSON('/api/slots').then(function(d){
      if (d.error) throw new Error(d.error);
      slots = d.slots; draw();
    }).catch(function(e){ box.innerHTML = '<div class="card"><div class="msg err">Could not load slots: '+esc(e.message)+'</div></div>'; });
  }
  draw(); load();
})();
</script>
</body></html>
