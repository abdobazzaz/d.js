<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radwa Vending – Sales History</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<div id="hdr"></div>
<div class="wrap" id="out"><div class="msg">Loading…</div></div>
<script src="/ui.js"></script>
<script>
(function(){
  var U = RUI, esc = U.esc;
  var money = function(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var actions = U.header('sales', { sub: 'Sales history · Dahban · Machine 203617400' });
  var rpHost = document.createElement('div');
  var xl = document.createElement('button'); xl.className = 'btn green'; xl.textContent = '⬇ Excel';
  actions.appendChild(rpHost); actions.appendChild(xl);

  var t = U.todayISO(), from = t.slice(0,8)+'01', to = t, showAll = false, last = null;
  var qs = function(){ return 'from='+from+'&to='+to; };
  U.rangePicker(rpHost, { from: from, to: to, onChange: function(f, e){ from = f; to = e; load(); } });
  xl.onclick = function(){ window.location = '/api/sales.xlsx?'+qs(); };

  function stat(l, v, s, cls){ return '<div class="stat '+(cls||'')+'"><div class="l">'+esc(l)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>'; }
  function sec(n, title, badge, body){
    return '<div class="card"><div class="sec-h"><div class="sec-n">'+n+'</div><span class="sec-t">'+title+'</span>'+(badge?'<span class="badge">'+esc(badge)+'</span>':'')+'</div>'+body+'</div>';
  }
  function chart(daily){
    var max = Math.max.apply(null, daily.map(function(d){return d.revenue;}).concat([1]));
    var step = Math.max(1, Math.ceil(daily.length / 12)), narrow = daily.length > 20;
    return '<div class="bars">'+daily.map(function(d,i){
      var h = Math.max(1, d.revenue / max * 100);
      return '<div class="bar-col" title="'+esc(d.date)+': '+money(d.revenue)+' SAR, '+d.orders+' orders">'+
        (!narrow && d.revenue ? '<div class="bar-v">'+Math.round(d.revenue)+'</div>' : '')+
        '<div class="bar" style="height:'+h+'%"></div><div class="bar-l">'+(i%step===0?esc(d.date.slice(5)):'')+'</div></div>';
    }).join('')+'</div>';
  }
  function render(d){
    last = d; var k = d.kpis, h = '';
    h += '<div class="stats">'+
      stat('Revenue', money(k.revenue)+' SAR', d.from+' → '+d.to, 'good')+
      stat('Orders', k.orders, k.notCompleted ? k.notCompleted+' not completed (excluded)' : 'completed orders', 'info')+
      stat('Avg order', money(k.avgOrder)+' SAR', 'per completed order')+
      stat('Avg per day', money(k.avgPerDay)+' SAR', d.daily.length+' day'+(d.daily.length===1?'':'s'))+
      stat('Best day', k.bestDay ? money(k.bestDay.revenue)+' SAR' : '—', k.bestDay ? k.bestDay.date+' · '+k.bestDay.orders+' orders' : 'no sales', 'warn')+
      '</div>';
    h += sec(1, 'Daily revenue', d.daily.length+' days', chart(d.daily));
    var maxS = Math.max.apply(null, d.bySku.map(function(x){return x.revenue;}).concat([1]));
    var tb = '<div class="scroll"><table><tr><th>Product</th><th class="n">Orders</th><th class="n">Revenue</th><th class="n">Share</th><th style="width:25%"></th></tr>';
    d.bySku.forEach(function(x){
      tb += '<tr><td>'+esc(x.emoji)+' <b>'+esc(x.code)+'</b> · '+esc(x.name)+'</td><td class="n">'+x.orders+'</td><td class="n">'+money(x.revenue)+'</td><td class="n">'+x.share.toFixed(1)+'%</td><td><div class="bar" style="height:8px;width:'+(x.revenue/maxS*100).toFixed(1)+'%;border-radius:4px"></div></td></tr>';
    });
    h += sec(2, 'By product', '', tb+'</table></div>');
    var list = showAll ? d.orders : d.orders.slice(0,100), ob;
    if (!d.orders.length) ob = '<div class="msg">No completed orders in this range.</div>';
    else {
      ob = '<div class="scroll"><table><tr><th>Time (KSA)</th><th>Product</th><th>Slot</th><th class="n">Amount</th></tr>';
      list.forEach(function(o){ ob += '<tr><td>'+esc(o.time)+'</td><td>'+esc(o.sku)+' · '+esc(o.product)+'</td><td>'+esc(o.slot)+'</td><td class="n">'+money(o.amount)+'</td></tr>'; });
      ob += '</table></div>';
      if (d.orders.length > 100 && !showAll) ob += '<div class="more"><button class="btn" id="all">Show all '+d.orders.length+'</button></div>';
    }
    h += sec(3, 'Orders', String(d.orders.length), ob);
    document.getElementById('out').innerHTML = h;
    var a = document.getElementById('all'); if (a) a.onclick = function(){ showAll = true; render(last); };
  }
  function load(){
    showAll = false;
    document.getElementById('out').innerHTML = '<div class="msg">Loading…</div>';
    U.getJSON('/api/sales?'+qs()).then(function(d){
      if (d.error) throw new Error(d.error);
      render(d);
    }).catch(function(e){ document.getElementById('out').innerHTML = '<div class="msg err">Could not load sales: '+esc(e.message)+'</div>'; });
  }
  load();
})();
</script>
</body></html>
